# Development overrides - use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: "3.9"

services:
  backend:
    environment:
      DEBUG: "true"
      LOG_LEVEL: debug
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  frontend:
    command: pnpm dev

