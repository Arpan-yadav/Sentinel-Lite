[tool.pyright]
include = ["backend", "ml", "tests", "scripts", "ai"]
extraPaths = [
    "backend",
    ".",
    "ml",
    "ai",
    "C:/Users/Arpan yadav/AppData/Local/Programs/Python/Python313/Lib/site-packages"
]
pythonPath = "C:/Users/Arpan yadav/AppData/Local/Programs/Python/Python313/python.exe"
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = false
reportMissingTypeStubs = false
typeCheckingMode = "off"
