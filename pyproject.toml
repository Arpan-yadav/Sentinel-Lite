[project]
name = "sentinel-lite"
version = "0.1.0"
description = "SentinelLite AI-SOC Security Operations Platform"
requires-python = ">=3.11"

[tool.pyrefly]
python-interpreter = "C:/Users/Arpan yadav/AppData/Local/Programs/Python/Python313/python.exe"
search-path = [
    "backend",
    ".",
    "ml",
    "ai",
    "C:/Users/Arpan yadav/AppData/Local/Programs/Python/Python313/Lib/site-packages"
]
enable-fallback-search-path = true
project-includes = [
    "backend",
    "ml",
    "tests",
    "scripts",
    "ai"
]

[tool.pyrefly.errors]
