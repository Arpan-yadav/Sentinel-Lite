name: SentinelLite CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend API & Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SQLITE_OVERRIDE: ./test.db
          SECRET_KEY: test-secret-key-32-chars-long-secure-token
        run: |
          pip install aiosqlite
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile

      - name: Lint
        run: |
          cd frontend
          pnpm lint

      - name: Type check
        run: |
          cd frontend
          pnpm exec tsc --noEmit

  ml-tests:
    name: ML Model Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run ML Unit Tests
        run: |
          pytest tests/ml/ -v --tb=short

      - name: Run ML Audit & Accuracy Suite
        run: |
          python scripts/verify_ml_model.py
