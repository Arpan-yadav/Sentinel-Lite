services:
  # ==========================================
  # 1. SentinelLite FastAPI Backend Web Service
  # ==========================================
  - type: web
    name: sentinellite-api
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinellite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "600"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  # ==========================================
  # 2. Managed PostgreSQL Instance (Free Tier)
  # ==========================================
  - name: sentinellite-db
    databaseName: sentinellite
    user: sentinellite
    plan: free
    region: oregon
